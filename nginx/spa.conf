# Coolify static Nginx. Generate Default, paste this, Save, then Deploy (Restart is not enough).

server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /.well-known/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }
}
