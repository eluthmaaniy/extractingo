        <h2>FAQ</h2>
        <h3>How do I extract email addresses from a PDF or Word file?</h3>
        <p>Drop a .pdf, .docx, .txt, or .csv onto Extractingo, or paste the text. The Emails tool finds every address in the file. Extraction runs in your browser — the file is not uploaded to a server.</p>
        <h3>Does Extractingo upload my email list?</h3>
        <p>No. Extractingo is a free, client-side tool. Lists, PDFs, and results stay in this browser until you clear them. There is no account and no server-side processing.</p>
        <h3>Will I lose my list if I refresh or close the tab?</h3>
        <p>No. The current list and results are saved in this browser so a refresh or sudden close does not wipe them. Use Clear or Remove to delete the saved list. If you drop a new file while one is already here, the new file replaces the old one — the two are not merged.</p>
        <h3>How do I separate Gmail from business emails?</h3>
        <p>Open Emails, extract, then use the Personal bucket. Choose Gmail only, Yahoo, Outlook, or all personal inboxes. Company domains land in Business / other.</p>
        <h3>How do I remove duplicate emails from a list?</h3>
        <p>Open Clean, paste one email per line, and run Remove duplicates. Matches are case-insensitive. Download the unique list as .txt or .csv.</p>
        <h3>How do I split a large email list into smaller files?</h3>
        <p>Open Split, paste a finished list (one email per line), set emails per segment, and run Split list. Copy or download each segment for outreach, CRM import, or sending tools.</p>
        <h3>Can I extract URLs from messy text?</h3>
        <p>Yes. The URLs tool keeps only the http(s) link itself — no surrounding words or punctuation. It is built for large pastes, crawls, and documents.</p>
        <h3>Who is Extractingo for?</h3>
        <p>Anyone who works with large email or URL lists: outbound and lead generation, sales ops, virtual assistants, list brokers, researchers pulling contacts from documents, newsletter operators, recruiters, event teams, and people cleaning CRM imports. You do not need a Scoutier account.</p>
